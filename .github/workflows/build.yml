name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc libpcap-dev libpq-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: CTest
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Npcap SDK
        run: |
          $url = "https://nmap.org/npcap/dist/npcap-sdk-1.16.zip"
          $out = "$env:TEMP\npcap-sdk-1.16.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          $tmp = "C:\npcap-sdk-tmp"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $out -DestinationPath $tmp -Force
          $inc = Get-ChildItem -Path $tmp -Recurse -Filter "pcap.h" | Select-Object -First 1
          if (-not $inc) { throw "Npcap SDK install failed: pcap.h not found after extraction" }
          $sdk = $inc.Directory.Parent.FullName
          "NPCAP_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NPCAP_SDK=$sdk"
        shell: powershell
      - name: Fetch Npcap runtime DLLs (no driver install)
        # NOTE: executing the Npcap installer hangs headless CI (driver
        # install blocks). Tests only need --help + --read offline replay,
        # which require just wpcap.dll/Packet.dll, not the kernel driver.
        # So extract the DLLs from the installer with 7-Zip and stage them
        # next to the test executables instead of running the installer.
        timeout-minutes: 5
        run: |
          $ver = "1.88"
          $url = "https://nmap.org/npcap/dist/npcap-$ver.exe"
          $out = "$env:TEMP\npcap-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          $extract = "$env:TEMP\npcap-extract"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found at $sevenZip" }
          & $sevenZip x $out "-o$extract" -y | Select-Object -Last 5
          Get-ChildItem -Recurse $extract | Where-Object { $_.Name -in @("wpcap.dll", "Packet.dll") } | Select-Object FullName, Length
          $wpcap = Get-ChildItem -Recurse $extract -Filter "wpcap.dll" | Where-Object { $_.FullName -match "x64|64" } | Select-Object -First 1
          if (-not $wpcap) { $wpcap = Get-ChildItem -Recurse $extract -Filter "wpcap.dll" | Select-Object -First 1 }
          $packet = Get-ChildItem -Recurse $extract -Filter "Packet.dll" | Where-Object { $_.FullName -match "x64|64" } | Select-Object -First 1
          if (-not $packet) { $packet = Get-ChildItem -Recurse $extract -Filter "Packet.dll" | Select-Object -First 1 }
          if (-not $wpcap) { throw "wpcap.dll not found in extracted Npcap installer" }
          if (-not $packet) { throw "Packet.dll not found in extracted Npcap installer" }
          $runtimeDir = Join-Path $extract "runtime-dlls"
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Copy-Item $wpcap.FullName (Join-Path $runtimeDir "wpcap.dll") -Force
          Copy-Item $packet.FullName (Join-Path $runtimeDir "Packet.dll") -Force
          "NPCAP_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Staged runtime DLLs from $($wpcap.FullName) and $($packet.FullName)"
        shell: powershell
      - name: Configure (MSVC)
        # NOTE: CMake reads $ENV{NPCAP_SDK} (persisted via GITHUB_ENV above).
        run: |
          if (-not (Test-Path "$env:NPCAP_SDK\Include\pcap.h")) { throw "NPCAP_SDK not found at $env:NPCAP_SDK" }
          cmake -S . -B build
        shell: powershell
      - name: Build
        run: cmake --build build --config Release
        shell: powershell
      - name: Stage Npcap DLLs for tests
        run: |
          Get-ChildItem build/Release
          $candidates = @()
          if ($env:NPCAP_RUNTIME_DIR) { $candidates += $env:NPCAP_RUNTIME_DIR }
          $candidates += @("C:\Windows\System32\Npcap", "C:\Windows\System32")
          foreach ($dll in @("wpcap.dll", "Packet.dll")) {
            foreach ($dir in $candidates) {
              $src = Join-Path $dir $dll
              if (Test-Path $src) {
                Copy-Item $src build/Release/ -Force
                Write-Host "Staged $dll from $src"
                break
              }
            }
          }
          if (-not (Test-Path "build/Release/wpcap.dll")) { throw "wpcap.dll not staged next to test executables" }
        shell: powershell
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
        shell: powershell
