name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sniffer
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sniffer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sniffer -d sniffer_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc clang python3 libpcap-dev libpq-dev postgresql-client
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Persistence and recovery
        run: python3 tests/postgres_integration.py build/sniffer build/stats_stress /usr/bin/psql 'host=127.0.0.1 port=5432 dbname=sniffer_test user=sniffer password=test-only-password' .
      - name: Sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang -DSNIFFER_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - name: Parser fuzz smoke
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DBUILD_TESTING=OFF -DSNIFFER_FUZZ=ON
          cmake --build build-fuzz --parallel 2
          SNIFFER_STATE_DIR=build-fuzz/state ./build-fuzz/fuzz_parsers -max_total_time=20 -max_len=4096
      - name: Container test stage
        run: docker build --target tests .
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Npcap SDK
        run: |
          $url = "https://nmap.org/npcap/dist/npcap-sdk-1.16.zip"
          $out = "$env:TEMP\npcap-sdk-1.16.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          $tmp = "C:\npcap-sdk-tmp"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $out -DestinationPath $tmp -Force
          $inc = Get-ChildItem -Path $tmp -Recurse -Filter "pcap.h" | Select-Object -First 1
          if (-not $inc) { throw "Npcap SDK install failed: pcap.h not found after extraction" }
          $sdk = $inc.Directory.Parent.FullName
          "NPCAP_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NPCAP_SDK=$sdk"
        shell: powershell
      - name: Fetch Npcap runtime DLLs (no driver install)
        # NOTE: executing the Npcap installer hangs headless CI (driver
        # install blocks). Tests only need --help + --read offline replay,
        # which require just wpcap.dll/Packet.dll, not the kernel driver.
        # So extract the DLLs from the installer with 7-Zip and stage them
        # next to the test executables instead of running the installer.
        timeout-minutes: 5
        run: |
          $ver = "1.88"
          $url = "https://nmap.org/npcap/dist/npcap-$ver.exe"
          $out = "$env:TEMP\npcap-$ver.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          $extract = "$env:TEMP\npcap-extract"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found at $sevenZip" }
          & $sevenZip x $out "-o$extract" -y | Select-Object -Last 5
          Get-ChildItem -Recurse $extract | Where-Object { $_.Name -in @("wpcap.dll", "Packet.dll") } | Select-Object FullName, Length
          # 0xc000007b = wrong-arch DLL. Runner is x64, so exclude ARM64
          # ("ARM64" contains "64" — a plain -match "64" misfires) and keep
          # wpcap.dll + Packet.dll from the SAME directory.
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vsWhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found via vswhere" }
          function Test-IsX64($path) {
            $h = & $dumpbin /headers $path 2>&1 | Select-String "machine \(x64\)"
            return ($null -ne $h)
          }
          $wpcapCandidates = Get-ChildItem -Recurse $extract -Filter "wpcap.dll" |
            Where-Object { $_.FullName -notmatch "(?i)arm" } |
            Sort-Object { if ($_.FullName -match "(?i)x64") { 0 } else { 1 } }, FullName
          if (-not $wpcapCandidates) { throw "wpcap.dll not found in extracted Npcap installer" }
          $wpcap = $null; $packet = $null
          foreach ($cand in $wpcapCandidates) {
            if (-not (Test-IsX64 $cand.FullName)) { Write-Host "Skipping non-x64 $($cand.FullName)"; continue }
            $sib = Join-Path $cand.DirectoryName "Packet.dll"
            if (-not (Test-Path $sib)) { Write-Host "Skipping $($cand.FullName): no sibling Packet.dll"; continue }
            if (-not (Test-IsX64 $sib)) { Write-Host "Skipping $($cand.FullName): sibling Packet.dll is not x64"; continue }
            $wpcap = $cand; $packet = Get-Item $sib; break
          }
          if (-not $wpcap) { throw "No x64 wpcap.dll + Packet.dll pair found in extracted installer" }
          Write-Host "Selected $($wpcap.FullName) + $($packet.FullName)"
          & $dumpbin /headers $wpcap.FullName 2>&1 | Select-String "machine \("
          & $dumpbin /headers $packet.FullName 2>&1 | Select-String "machine \("
          $runtimeDir = Join-Path $extract "runtime-dlls"
          New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
          Copy-Item $wpcap.FullName (Join-Path $runtimeDir "wpcap.dll") -Force
          Copy-Item $packet.FullName (Join-Path $runtimeDir "Packet.dll") -Force
          "NPCAP_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Staged runtime DLLs from $($wpcap.FullName) and $($packet.FullName)"
        shell: powershell
      - name: Configure (MSVC)
        # NOTE: CMake reads $ENV{NPCAP_SDK} (persisted via GITHUB_ENV above).
        run: |
          if (-not (Test-Path "$env:NPCAP_SDK\Include\pcap.h")) { throw "NPCAP_SDK not found at $env:NPCAP_SDK" }
          cmake -S . -B build
        shell: powershell
      - name: Build
        run: cmake --build build --config Release
        shell: powershell
      - name: Stage Npcap DLLs for tests
        run: |
          Get-ChildItem build/Release
          $candidates = @()
          if ($env:NPCAP_RUNTIME_DIR) { $candidates += $env:NPCAP_RUNTIME_DIR }
          $candidates += @("C:\Windows\System32\Npcap", "C:\Windows\System32")
          foreach ($dll in @("wpcap.dll", "Packet.dll")) {
            foreach ($dir in $candidates) {
              $src = Join-Path $dir $dll
              if (Test-Path $src) {
                Copy-Item $src build/Release/ -Force
                Write-Host "Staged $dll from $src"
                break
              }
            }
          }
          if (-not (Test-Path "build/Release/wpcap.dll")) { throw "wpcap.dll not staged next to test executables" }
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vsWhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          & $dumpbin /headers build/Release/sniffer.exe 2>&1 | Select-String "machine \("
          & $dumpbin /headers build/Release/wpcap.dll 2>&1 | Select-String "machine \("
          & $dumpbin /headers build/Release/Packet.dll 2>&1 | Select-String "machine \("
          & $dumpbin /DEPENDENTS build/Release/sniffer.exe 2>&1 | Select-String "wpcap|Packet|libpq"
        shell: powershell
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
        shell: powershell
