name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake gcc libpcap-dev libpq-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: CTest
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Npcap SDK
        run: |
          $url = "https://nmap.org/npcap/dist/npcap-sdk-1.16.zip"
          $out = "$env:TEMP\npcap-sdk-1.16.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          $tmp = "C:\npcap-sdk-tmp"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $out -DestinationPath $tmp -Force
          $inc = Get-ChildItem -Path $tmp -Recurse -Filter "pcap.h" | Select-Object -First 1
          if (-not $inc) { throw "Npcap SDK install failed: pcap.h not found after extraction" }
          $sdk = $inc.Directory.Parent.FullName
          "NPCAP_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "NPCAP_SDK=$sdk"
        shell: powershell
      - name: Configure (MSVC)
        # NOTE: CMake reads $ENV{NPCAP_SDK} (persisted via GITHUB_ENV above).
        run: |
          if (-not (Test-Path "$env:NPCAP_SDK\Include\pcap.h")) { throw "NPCAP_SDK not found at $env:NPCAP_SDK" }
          cmake -S . -B build
        shell: powershell
      - name: Build
        run: cmake --build build --config Release
        shell: powershell
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
        shell: powershell
