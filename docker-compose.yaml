services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sniffer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-snifferdb}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_migration_add_dhcp.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-sniffer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-snifferdb}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
  sniffer:
    profiles: ["live"]
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-snifferdb}
      PGUSER: ${POSTGRES_USER:-sniffer}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ""
      SNIFFER_IFACE: ${SNIFFER_IFACE:-eth0}
      SNIFFER_SENSOR_ID: ${SNIFFER_SENSOR_ID:-container}
      STATS_FLUSH_MS: ${STATS_FLUSH_MS:-5000}
    depends_on:
      postgres: {condition: service_healthy}
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]
    volumes: ["sniffer-state:/state"]
    command: ["--no-env", "--db-required", "--iface", "${SNIFFER_IFACE:-eth0}"]
    stop_grace_period: 20s
  replay:
    profiles: ["replay"]
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-snifferdb}
      PGUSER: ${POSTGRES_USER:-sniffer}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ""
      SNIFFER_SENSOR_ID: replay
    depends_on:
      postgres: {condition: service_healthy}
    cap_drop: [ALL]
    volumes:
      - ./tests/pcaps:/pcaps:ro
    command: ["--no-env", "--db-required", "--read", "/pcaps/eth-tcp-http.pcap"]
    stop_grace_period: 20s
volumes:
  pgdata:
  grafana-data:
  sniffer-state:
